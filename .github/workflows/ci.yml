name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    env:
      BILI_AGENT_CREDENTIAL_FILE: /tmp/bili-agent-ci-missing-session.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install '.[dev]'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel
        run: python -m build
      - name: Validate metadata
        run: python -m twine check --strict dist/*
      - name: Audit archive contents
        run: python scripts/audit_release.py dist
      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed entry point, docs and SDK
        run: python scripts/smoke_install.py
      - name: Retest installed wheel
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
